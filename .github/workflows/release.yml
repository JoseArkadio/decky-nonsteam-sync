name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: pytest tests/ -q

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

      # A tag that disagrees with package.json ships a plugin whose version
      # lies to Decky. Fail here rather than in someone's plugin list.
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$PKG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Build (fail on TypeScript warnings)
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log
          if grep -q "plugin typescript" build.log; then
            echo "::error::rollup reported TypeScript problems"
            grep "plugin typescript" build.log
            exit 1
          fi

      # Decky's manual install requires exactly one <folder>/plugin.json at
      # depth 1 in the zip (decky_loader/browser.py). Ship only what the plugin
      # needs at run time — no src/, no tests, no node_modules.
      - name: Package
        run: |
          set -e
          OUT="NonSteam Sync"
          mkdir -p "dist-zip/$OUT"
          mkdir -p "dist-zip/$OUT/dist"
          cp plugin.json package.json main.py LICENSE README.md "dist-zip/$OUT/"
          cp -r py_modules "dist-zip/$OUT/"
          # only the bundle — the 7 MB sourcemap belongs on GitHub, not on the device
          cp dist/index.js "dist-zip/$OUT/dist/"
          find "dist-zip/$OUT" -name '__pycache__' -type d -exec rm -rf {} +
          cd dist-zip && zip -r ../NonSteam-Sync.zip "$OUT"
          cd .. && unzip -l NonSteam-Sync.zip

      - name: Checksum
        run: sha256sum NonSteam-Sync.zip | tee NonSteam-Sync.zip.sha256

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            NonSteam-Sync.zip
            NonSteam-Sync.zip.sha256
          generate_release_notes: true
          body: |
            ## Install

            In Decky: **⚙ Settings → Developer mode → Install Plugin from URL**, then paste:

            ```
            https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/NonSteam-Sync.zip
            ```

            Verify the download against `NonSteam-Sync.zip.sha256` if you want to.
